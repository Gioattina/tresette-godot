name: Build iOS IPA
on: [push]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scarica Ultimo Godot Stabile e Template
        run: |
          TAG=$(curl -s https://github.com | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          VER_FOLDER=$(echo $TAG | sed 's/-/./g')
          echo "Scarico Godot versione: $TAG (Cartella: $VER_FOLDER)"
          
          curl -L -f -o godot.zip "https://github.com{TAG}/Godot_v${TAG}_macos.universal.zip"
          unzip -q godot.zip
          
          mkdir -p "$HOME/Library/Application Support/Godot/export_templates/${VER_FOLDER}"
          curl -L -f -o templates.tpz "https://github.com{TAG}/Godot_v${TAG}_export_templates.tpz"
          unzip -q templates.tpz -d templates_tmp
          mv templates_tmp/templates/* "$HOME/Library/Application Support/Godot/export_templates/${VER_FOLDER}/"
      - name: Esporta Progetto Xcode
        run: |
          mkdir -p ios_build
          ./Godot.app/Contents/MacOS/Godot --headless --export-release "iOS" ios_build/Tressette.ipa
      - name: Compila IPA non firmato
        run: |
          cd ios_build
          xcodebuild -project Tressette.xcodeproj -scheme Tressette -configuration Release -sdk iphoneos CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO CONFIGURATION_BUILD_DIR=build
          mkdir -p Payload
          cp -r build/*.app Payload/
          zip -r ../Tressette.ipa Payload
      - name: Carica IPA
        uses: actions/upload-artifact@v4
        with:
          name: Tressette-iOS-IPA
          path: Tressette.ipa
